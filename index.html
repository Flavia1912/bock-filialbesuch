<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Filialbesuch">
<title>Filialbesuch · Bäcker Bock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f9f9f9;--card:#fff;--cream:#f4f4f4;
    --black:#0a0a0a;--dark:#1a1a1a;--mid:#555;--light:#888;--xlight:#bbb;
    --border:#e0e0e0;--border-dark:#333;
    --accent:#0a0a0a;--accent-lt:#f0f0f0;
    --green:#1a7a3a;--green-lt:#e8f5ed;
    --red:#c0392b;--red-lt:#fdecea;
    --amber:#b8860b;--amber-lt:#fef8e1;
    --blue:#1a4a7a;--blue-lt:#e8f0fb;
    --shadow:0 1px 4px rgba(0,0,0,.08);--shadow-md:0 4px 16px rgba(0,0,0,.10);
    --r:10px;--rsm:6px;
    /* Aliase für dieses Tool */
    --ink:var(--dark); --paper:var(--bg); --line:var(--border); --muted:var(--light);
    --good:var(--green); --good-bg:var(--green-lt);
    --bad:var(--red); --bad-bg:var(--red-lt);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--dark);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:84px;
    min-height:100vh;
    font-size:14px;
  }
  .num{font-family:'Playfair Display',serif; font-variant-numeric: oldstyle-nums;}
  header.top{
    position:sticky; top:0; z-index:40;
    background:var(--black); color:#fff;
    padding:0 18px; height:56px;
    display:flex; align-items:center; justify-content:space-between;
  }
  header.top .brand{
    font-family:'Playfair Display',serif; font-weight:700; font-size:17px; letter-spacing:.2px;
  }
  header.top .brand span{color:#fff;}
  header.top .sub{font-size:11px; color:rgba(255,255,255,.55); margin-top:1px; letter-spacing:.02em;}
  .timerpill{
    background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.25);
    border-radius:var(--rsm); padding:6px 14px; font-family:'Playfair Display',serif;
    font-size:15px; font-weight:700; display:flex; align-items:center; gap:8px; color:#fff;
  }
  .timerpill .dot{width:7px;height:7px;border-radius:50%;background:var(--red);animation:pulse 1.4s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.25;}}

  main{max-width:640px; margin:0 auto; padding:18px 16px 30px;}

  /* Tabs / bottom nav */
  nav.tabs{
    position:fixed; bottom:0; left:0; right:0; z-index:50;
    background:#fff; border-top:1.5px solid var(--border);
    display:flex; padding:8px 10px calc(8px + env(safe-area-inset-bottom));
    max-width:640px; margin:0 auto;
  }
  nav.tabs button{
    flex:1; background:none; border:none; padding:8px 4px; font-family:'Inter',sans-serif;
    font-size:12px; font-weight:600; color:var(--light); display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer;
  }
  nav.tabs button .ic{font-size:18px;}
  nav.tabs button.active{color:var(--black);}
  nav.tabs button.active .ic{color:var(--black);}

  .screen{display:none;}
  .screen.active{display:block;}

  /* Start form */
  .card{
    background:var(--card); border:1px solid var(--border); border-radius:var(--r);
    box-shadow:var(--shadow);
    padding:20px; margin-bottom:14px;
  }
  .card h2{font-family:'Playfair Display',serif; font-size:1.15rem; margin:0 0 4px; color:var(--black);}
  .card .lead{color:var(--light); font-size:13px; margin:0 0 18px; line-height:1.5;}
  label{display:block; font-size:11px; font-weight:600; color:var(--light); text-transform:uppercase; letter-spacing:.07em; margin-bottom:6px; margin-top:16px;}
  label:first-of-type{margin-top:0;}
  select, input[type=text], textarea{
    width:100%; border:1.5px solid var(--border); border-radius:var(--rsm); padding:12px 14px;
    font-family:'Inter',sans-serif; font-size:15px; background:#fff; color:var(--dark);
    outline:none; transition:border-color .2s;
  }
  select:focus, input:focus, textarea:focus{border-color:var(--black);}
  textarea{resize:vertical; min-height:64px; line-height:1.5;}
  .primary{
    width:100%; margin-top:22px; background:var(--black); color:#fff; border:none;
    padding:14px; border-radius:var(--rsm); font-family:'Inter',sans-serif; font-weight:600; font-size:14px;
    cursor:pointer; letter-spacing:.03em; transition:opacity .2s;
  }
  .primary:hover{opacity:.85;}
  .primary:disabled{background:var(--xlight); cursor:not-allowed; opacity:1;}
  .primary.stop{background:var(--red);}
  .ghost{background:none;border:1.5px solid var(--border); color:var(--dark); padding:10px 14px; border-radius:var(--rsm); font-weight:600; font-size:13px; cursor:pointer;}

  /* Checklist categories */
  .catcard{background:var(--card); border:1px solid var(--border); border-radius:var(--r); box-shadow:var(--shadow); margin-bottom:14px; overflow:hidden;}
  .cathead{
    display:flex; align-items:baseline; gap:10px; padding:16px 18px; cursor:pointer;
    border-bottom:1px solid transparent;
  }
  .cathead .n{font-family:'Playfair Display',serif; font-size:20px; color:var(--black); font-weight:700; min-width:26px;}
  .cathead .t{font-family:'Playfair Display',serif; font-size:16px; font-weight:700; flex:1; color:var(--black);}
  .cathead .prog{font-size:11px; color:var(--light); font-weight:600;}
  .catbody{padding:0 18px 18px; border-top:1px solid var(--border); display:none;}
  .catcard.open .catbody{display:block;}
  .catcard.open .cathead{border-bottom-color:var(--border);}

  .item{padding:14px 0; border-bottom:1px dashed var(--border);}
  .item:last-of-type{border-bottom:none;}
  .item .itxt{font-size:14px; line-height:1.4; margin-bottom:10px; color:var(--dark);}
  .ratebar{display:flex; gap:8px;}
  .ratebar button{
    flex:1; padding:9px 4px; border-radius:var(--rsm); border:1.5px solid var(--border); background:#fff;
    font-size:12px; font-weight:700; color:var(--light); cursor:pointer; transition:border-color .2s;
  }
  .ratebar button.sel.good{background:var(--green-lt); border-color:var(--green); color:var(--green);}
  .ratebar button.sel.mid{background:var(--amber-lt); border-color:var(--amber); color:var(--amber);}
  .ratebar button.sel.bad{background:var(--red-lt); border-color:var(--red); color:var(--red);}
  .notetoggle{background:none; border:none; color:var(--light); font-size:11.5px; margin-top:8px; padding:0; cursor:pointer; text-decoration:underline; text-underline-offset:2px;}
  .note{margin-top:8px; display:none;}
  .note.open{display:block;}
  .note textarea{min-height:50px; font-size:13px;}

  .beurt{margin-top:6px;}
  .beurt label{margin-top:0;}

  /* Übersicht */
  .filters{display:flex; gap:8px; margin-bottom:16px; overflow-x:auto; padding-bottom:2px;}
  .filters select{width:auto; flex:none;}
  .visitcard{background:var(--card); border:1px solid var(--border); border-radius:var(--r); box-shadow:var(--shadow); padding:14px 16px; margin-bottom:10px; cursor:pointer;}
  .visitcard .row1{display:flex; justify-content:space-between; align-items:center;}
  .visitcard .fil{font-family:'Playfair Display',serif; font-weight:700; font-size:16px; color:var(--black);}
  .visitcard .status{font-size:10px; font-weight:700; padding:3px 8px; border-radius:20px; text-transform:uppercase; letter-spacing:.05em;}
  .status.laeuft{background:var(--red-lt); color:var(--red);}
  .status.fertig{background:var(--green-lt); color:var(--green);}
  .visitcard .meta{font-size:12.5px; color:var(--light); margin-top:5px;}
  .empty{text-align:center; color:var(--light); padding:50px 20px; font-size:14px; line-height:1.6;}

  .detail .catsum{margin-bottom:16px;}
  .detail .catsum h3{font-family:'Playfair Display',serif; font-size:15px; margin:0 0 8px; color:var(--black);}
  .detail .drow{display:flex; justify-content:space-between; gap:10px; font-size:13.5px; padding:6px 0; border-bottom:1px dashed var(--border);}
  .detail .drow .lbl{color:var(--dark);}
  .detail .badge{font-size:11px; font-weight:700; padding:2px 9px; border-radius:20px; white-space:nowrap;}
  .badge.good{background:var(--green-lt); color:var(--green);}
  .badge.mid{background:var(--amber-lt); color:var(--amber);}
  .badge.bad{background:var(--red-lt); color:var(--red);}
  .detail .dnote{font-size:12.5px; color:var(--light); font-style:italic; padding:4px 0 8px;}
  .detail .beurtext{font-size:13px; background:var(--cream); border:1px solid var(--border); border-radius:var(--rsm); padding:10px 12px; margin-top:6px; white-space:pre-wrap;}
  .backbtn{display:inline-flex; align-items:center; gap:6px; background:none; border:none; color:var(--light); font-size:13px; font-weight:600; margin-bottom:14px; padding:0; cursor:pointer;}

  .toast{
    position:fixed; bottom:96px; left:50%; transform:translateX(-50%) translateY(10px); opacity:0;
    background:var(--black); color:#fff; padding:10px 18px; border-radius:30px; font-size:13px; font-weight:600;
    transition:all .25s ease; z-index:99; pointer-events:none; max-width:90%; text-align:center;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>

<header class="top">
  <div>
    <div class="brand">Bäcker <span>Bock</span></div>
    <div class="sub" id="headerSub">Filialbesuch</div>
  </div>
  <div class="timerpill" id="timerPill" style="display:none;"><span class="dot"></span><span id="timerText">00:00</span></div>
</header>

<main>

  <!-- START SCREEN -->
  <section class="screen" id="screen-start">
    <div class="card">
      <h2>Neuer Filialbesuch</h2>

      <label>Prüfer / Prüferin</label>
      <input type="text" id="inPruefer" placeholder="Name eingeben">

      <label>Filiale</label>
      <select id="inFiliale">
        <option value="">Bitte wählen …</option>
      </select>

      <button class="primary" id="btnStart" disabled>Besuch starten</button>
    </div>
  </section>

  <!-- ACTIVE VISIT SCREEN -->
  <section class="screen" id="screen-active">
    <div class="card" style="padding:16px 18px;">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <div>
          <div style="font-family:'Playfair Display',serif; font-weight:700; font-size:18px;" id="activeFiliale">–</div>
          <div style="font-size:12.5px; color:var(--muted);" id="activeMeta">–</div>
        </div>
      </div>
    </div>

    <div id="catContainer"></div>

    <div class="card">
      <label>Abschlussbemerkung</label>
      <textarea id="inAbschluss" placeholder="Zusammenfassung, nächste Schritte, Vereinbarungen …"></textarea>
      <button class="primary stop" id="btnStop">Besuch beenden</button>
    </div>
  </section>

  <!-- ÜBERSICHT SCREEN -->
  <section class="screen" id="screen-overview">
    <div class="filters">
      <select id="filterFiliale"><option value="">Alle Filialen</option></select>
      <select id="filterStatus">
        <option value="">Alle Status</option>
        <option value="laeuft">Läuft gerade</option>
        <option value="fertig">Abgeschlossen</option>
      </select>
    </div>
    <div id="visitList"></div>
  </section>

  <!-- DETAIL SCREEN -->
  <section class="screen" id="screen-detail">
    <button class="backbtn" id="btnBack">← Zur Übersicht</button>
    <div class="card" id="detailHead"></div>
    <div class="detail" id="detailBody"></div>
  </section>

</main>

<nav class="tabs">
  <button data-tab="start" class="tab-btn active"><span class="ic">＋</span>Neuer Besuch</button>
  <button data-tab="overview" class="tab-btn"><span class="ic">≣</span>Übersicht</button>
</nav>

<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script>
/* ══════════════════════ STAMMDATEN ══════════════════════ */
const FILIALEN = ["B1","B5","B7","B8","B11","B12","B16","B17"];

// Bewertungs-Skalen
const SCALE = {
  jpn: [{k:"ja",cls:"good"},{k:"+/-",cls:"mid"},{k:"nein",cls:"bad"}],
  gms: [{k:"gut",cls:"good"},{k:"mittel",cls:"mid"},{k:"schlecht",cls:"bad"}],
  gps: [{k:"gut",cls:"good"},{k:"+/-",cls:"mid"},{k:"schlecht",cls:"bad"}]
};

const KATEGORIEN = [
  { id:"aeusseres", titel:"Äußeres Erscheinungsbild",
    items:[
      {t:"Ware von außen attraktiv sichtbar", s:"jpn"},
      {t:"Sauberkeit außen (Fenster, Fassade)", s:"jpn"},
      {t:"Äußerer erster Eindruck", s:"gms"}
    ]},
  { id:"beleuchtung", titel:"Beleuchtung",
    items:[
      {t:"Außenwerbung beleuchtet", s:"jpn"},
      {t:"Theke ausgeleuchtet", s:"jpn"},
      {t:"Brotregal ausgeleuchtet / Licht brotgerecht", s:"jpn"},
      {t:"Allgemeine Raumbeleuchtung in Ordnung", s:"jpn"},
      {t:"Nebenräume, Toiletten in Ordnung", s:"jpn"}
    ]},
  { id:"ordnung", titel:"Ordnung und Sauberkeit",
    items:[
      {t:"Vor dem Laden", s:"gps"},
      {t:"Im Laden / Kundenbereich", s:"gps"},
      {t:"Im Sitzbereich, Tische, Abräumtabletts", s:"gps"},
      {t:"Hinter der Theke", s:"gps"},
      {t:"Hinter der Kühlung", s:"gps"},
      {t:"Hinter dem Snacktresen", s:"gps"},
      {t:"Im Brotregal", s:"gps"},
      {t:"Im Küchenbereich", s:"gps"},
      {t:"Im Lagerbereich", s:"gps"},
      {t:"Auf den Toiletten", s:"gps"},
      {t:"Waschbecken", s:"gps"},
      {t:"Papier vorhanden", s:"gps"},
      {t:"Handtücher", s:"gps"},
      {t:"Einhaltung HACCP", s:"gps"},
      {t:"Vorgeschriebene Kühltemperatur", s:"gps"},
      {t:"Vorgeschriebene Kühlschranktemperatur", s:"gps"},
      {t:"Vorgeschriebene Frostertemperatur", s:"gps"},
      {t:"Vorgeschriebene Gefrierschranktemperatur", s:"gps"}
    ]},
  { id:"werbung", titel:"Werbung",
    items:[
      {t:"Straßenaufsteller (vorhanden, funktionstüchtig, aktuelle Plakatierung)", s:"gps"},
      {t:"Außenbereich", s:"gps"},
      {t:"Preisschilder (Sauberkeit, Aktualität, Qualität)", s:"gps"},
      {t:"Thekenaufsteller", s:"gps"},
      {t:"Wandtafeln beschriftet", s:"gps"},
      {t:"Leuchtkästen", s:"gps"},
      {t:"Probestücke", s:"gps"},
      {t:"Aktionsschilder", s:"gps"}
    ]},
  { id:"warenpraesentation", titel:"Warenpräsentation",
    items:[
      {t:"Gute Präsentation der Tageszeit entsprechend (Früh-, Mittag- u. Abendtheke)", s:"gps"},
      {t:"Backwarentheke", s:"gps"},
      {t:"Brotregal", s:"gps"},
      {t:"Snack- / Gastrotheke", s:"gps"},
      {t:"Frische positiv strahlend", s:"gps"},
      {t:"Zur richtigen Zeit nachgebacken", s:"gps"},
      {t:"Einzelne Waren unattraktiv / Qualitätsbeanstandungen", s:"gps"},
      {t:"Ofenfrische Backwaren vorhanden", s:"gps"},
      {t:"Thekenplan eingehalten?", s:"gps"}
    ]},
  { id:"personal", titel:"Personal",
    items:[
      {t:"Adrett", s:"gps"},
      {t:"Geforderte Arbeitskleidung, Namensschilder", s:"gps"},
      {t:"Sauber, gründlich", s:"gps"},
      {t:"Gesprächsfreundlich", s:"gps"},
      {t:"Verkaufsstark / Zusatzverkäufe", s:"gps"},
      {t:"Aktive Verkostung", s:"gps"},
      {t:"Produktkenntnisse", s:"gps"},
      {t:"Ordentliches Verpacken", s:"gps"},
      {t:"Backqualität", s:"gps"}
    ]}
];

/* ══════════════════════ FIREBASE ══════════════════════ */
const FIREBASE_CONFIG={
  apiKey:"AIzaSyCN7nOSrQNmbC-0PQ60fEMAn4yO7gScWzs",
  authDomain:"bock-filialbesuche.firebaseapp.com",
  databaseURL:"https://bock-filialbesuche-default-rtdb.europe-west1.firebasedatabase.app",
  projectId:"bock-filialbesuche",
  storageBucket:"bock-filialbesuche.firebasestorage.app",
  messagingSenderId:"175432038003",
  appId:"1:175432038003:web:2d1581f8b7f32e93f8dc06"
};
if(!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
const db = firebase.database();
const PATH = "filialbesuche";
const JOERG_MAIL_URL = "https://script.google.com/macros/s/AKfycbyHTSc6UU3arVui7pYX6G1D1stbfd9H3ED2hD_qgDXoyP4tB4S20QhqrnG82TPRgL5K/exec";

/* ══════════════════════ STATE ══════════════════════ */
let activeVisitId = localStorage.getItem("fb_activeVisitId") || null;
let activeVisit = null;
let timerInterval = null;
let allVisits = {};
let currentDetailId = null;

/* ══════════════════════ INIT ══════════════════════ */
function initSelects(){
  const fs = document.getElementById("inFiliale");
  const ff = document.getElementById("filterFiliale");
  FILIALEN.forEach(f=>{
    fs.insertAdjacentHTML("beforeend", `<option value="${f}">${f}</option>`);
    ff.insertAdjacentHTML("beforeend", `<option value="${f}">${f}</option>`);
  });
}
initSelects();

document.getElementById("inPruefer").addEventListener("input", checkStartReady);
document.getElementById("inFiliale").addEventListener("change", checkStartReady);
function checkStartReady(){
  const ok = document.getElementById("inPruefer").value.trim() && document.getElementById("inFiliale").value;
  document.getElementById("btnStart").disabled = !ok;
}

/* ══════════════════════ TABS / SCREENS ══════════════════════ */
function showScreen(id){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById("screen-"+id).classList.add("active");
}
document.querySelectorAll(".tab-btn").forEach(b=>{
  b.addEventListener("click", ()=>{
    document.querySelectorAll(".tab-btn").forEach(x=>x.classList.remove("active"));
    b.classList.add("active");
    if(b.dataset.tab==="start"){
      showScreen(activeVisitId ? "active" : "start");
    } else {
      showScreen("overview");
    }
  });
});
document.getElementById("btnBack").addEventListener("click", ()=> showScreen("overview"));

/* ══════════════════════ START BESUCH ══════════════════════ */
document.getElementById("btnStart").addEventListener("click", ()=>{
  const pruefer = document.getElementById("inPruefer").value.trim();
  const filiale = document.getElementById("inFiliale").value;
  const startISO = new Date().toISOString();

  const kategorienData = {};
  KATEGORIEN.forEach(k=>{
    kategorienData[k.id] = { beurteilung:"", items:{} };
    k.items.forEach((it,i)=>{ kategorienData[k.id].items[i] = { rating:"", note:"" }; });
  });

  const visit = {
    filiale, pruefer,
    start:startISO, end:null, status:"laeuft",
    abschluss:"",
    kategorien: kategorienData
  };

  const ref = db.ref(PATH).push();
  ref.set(visit).then(()=>{
    activeVisitId = ref.key;
    localStorage.setItem("fb_activeVisitId", activeVisitId);
    loadActiveVisit();
    notifyIfJoerg(pruefer, filiale, startISO);
  }).catch(err=>{
    console.error("Fehler beim Starten:", err);
    alert("Besuch konnte nicht gespeichert werden:\n"+err.message);
  });
});

function notifyIfJoerg(pruefer, filiale, startISO){
  if(!/j(ö|oe)rg/i.test(pruefer)) return;
  const zeit = new Date(startISO).toLocaleString("de-DE",{dateStyle:"short",timeStyle:"short"});
  fetch(JOERG_MAIL_URL, {
    method:"POST",
    mode:"no-cors",
    headers:{"Content-Type":"text/plain;charset=utf-8"},
    body: JSON.stringify({filiale, pruefer, zeit})
  }).catch(err=> console.error("Mail-Trigger fehlgeschlagen:", err));
}

function loadActiveVisit(){
  if(!activeVisitId) return;
  db.ref(PATH+"/"+activeVisitId).on("value", snap=>{
    const v = snap.val();
    if(!v){ activeVisitId=null; localStorage.removeItem("fb_activeVisitId"); showScreen("start"); return; }
    activeVisit = v;
    if(v.status==="fertig"){
      // beendet an anderem Gerät o.ä. -> zurück zum Start
      activeVisitId=null; localStorage.removeItem("fb_activeVisitId");
      stopTimerUI();
      showScreen("start");
      return;
    }
    document.getElementById("activeFiliale").textContent = "Filiale "+v.filiale;
    document.getElementById("activeMeta").textContent = v.pruefer;
    document.getElementById("inAbschluss").value = v.abschluss||"";
    renderCategories(v);
    startTimerUI(v.start);
    showScreen("active");
    document.querySelectorAll(".tab-btn").forEach(b=>b.classList.toggle("active", b.dataset.tab==="start"));
  });
}

function startTimerUI(startISO){
  document.getElementById("timerPill").style.display="flex";
  document.getElementById("headerSub").textContent = "Besuch läuft";
  clearInterval(timerInterval);
  function tick(){
    const secs = Math.floor((Date.now()-new Date(startISO).getTime())/1000);
    const h = Math.floor(secs/3600), m = Math.floor((secs%3600)/60), s = secs%60;
    document.getElementById("timerText").textContent =
      (h>0? String(h).padStart(2,"0")+":":"") + String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");
  }
  tick();
  timerInterval = setInterval(tick,1000);
}
function stopTimerUI(){
  clearInterval(timerInterval);
  document.getElementById("timerPill").style.display="none";
  document.getElementById("headerSub").textContent = "Filialbesuch";
}

/* ══════════════════════ KATEGORIEN RENDERN ══════════════════════ */
function renderCategories(v){
  const cont = document.getElementById("catContainer");
  cont.innerHTML = "";
  KATEGORIEN.forEach((k,ki)=>{
    const kd = (v.kategorien && v.kategorien[k.id]) || {items:{}, beurteilung:""};
    const done = k.items.filter((_,i)=> kd.items[i] && kd.items[i].rating).length;
    const card = document.createElement("div");
    card.className = "catcard" + (ki===0 ? " open":"");
    card.innerHTML = `
      <div class="cathead">
        <div class="n num">${ki+1}</div>
        <div class="t">${k.titel}</div>
        <div class="prog">${done}/${k.items.length}</div>
      </div>
      <div class="catbody">
        ${k.items.map((it,i)=>`
          <div class="item">
            <div class="itxt">${it.t}</div>
            <div class="ratebar" data-kat="${k.id}" data-idx="${i}">
              ${SCALE[it.s].map(op=>`<button data-val="${op.k}" data-cls="${op.cls}" class="${(kd.items[i]&&kd.items[i].rating===op.k)?'sel '+op.cls:''}">${op.k}</button>`).join("")}
            </div>
            <button class="notetoggle" data-toggle="note-${k.id}-${i}">${(kd.items[i]&&kd.items[i].note)?'Notiz bearbeiten':'+ Notiz'}</button>
            <div class="note ${(kd.items[i]&&kd.items[i].note)?'open':''}" id="note-${k.id}-${i}">
              <textarea placeholder="Kurze Notiz zu diesem Punkt …" data-kat="${k.id}" data-idx="${i}" data-field="note">${(kd.items[i]&&kd.items[i].note)||""}</textarea>
            </div>
          </div>
        `).join("")}
        <div class="beurt">
          <label>Beurteilung ${k.titel}</label>
          <textarea placeholder="Freitext zu diesem Bereich …" data-kat="${k.id}" data-field="beurteilung">${kd.beurteilung||""}</textarea>
        </div>
      </div>
    `;
    cont.appendChild(card);
  });

  // Accordion toggle
  cont.querySelectorAll(".cathead").forEach(h=>{
    h.addEventListener("click", ()=> h.parentElement.classList.toggle("open"));
  });
  // Rating buttons
  cont.querySelectorAll(".ratebar").forEach(bar=>{
    bar.addEventListener("click", e=>{
      const btn = e.target.closest("button"); if(!btn) return;
      const kat = bar.dataset.kat, idx = bar.dataset.idx, val = btn.dataset.val;
      db.ref(`${PATH}/${activeVisitId}/kategorien/${kat}/items/${idx}/rating`).set(val);
    });
  });
  // Note toggles
  cont.querySelectorAll(".notetoggle").forEach(t=>{
    t.addEventListener("click", ()=>{
      document.getElementById(t.dataset.toggle).classList.toggle("open");
    });
  });
  // Text fields (notes + beurteilung) -> debounced save
  cont.querySelectorAll("textarea[data-field]").forEach(ta=>{
    ta.addEventListener("input", debounce(()=>{
      const kat = ta.dataset.kat, field = ta.dataset.field;
      if(field==="note"){
        db.ref(`${PATH}/${activeVisitId}/kategorien/${kat}/items/${ta.dataset.idx}/note`).set(ta.value);
      } else {
        db.ref(`${PATH}/${activeVisitId}/kategorien/${kat}/beurteilung`).set(ta.value);
      }
    }, 500));
  });
}

document.getElementById("inAbschluss").addEventListener("input", debounce(function(){
  if(activeVisitId) db.ref(`${PATH}/${activeVisitId}/abschluss`).set(this.value);
},500));

function debounce(fn, wait){
  let t; return function(...a){ clearTimeout(t); t=setTimeout(()=>fn.apply(this,a), wait); };
}

/* ══════════════════════ BESUCH BEENDEN ══════════════════════ */
document.getElementById("btnStop").addEventListener("click", ()=>{
  if(!confirm("Besuch jetzt beenden? Die Zeiterfassung wird gestoppt.")) return;
  const endISO = new Date().toISOString();
  db.ref(`${PATH}/${activeVisitId}`).update({end:endISO, status:"fertig"}).then(()=>{
    stopTimerUI();
    localStorage.removeItem("fb_activeVisitId");
    activeVisitId = null;
    showToast("Besuch gespeichert");
    resetStartForm();
    document.querySelectorAll(".tab-btn").forEach(b=>b.classList.toggle("active", b.dataset.tab==="overview"));
    showScreen("overview");
  });
});
function resetStartForm(){
  document.getElementById("inPruefer").value="";
  document.getElementById("inFiliale").value="";
  document.getElementById("btnStart").disabled=true;
}

/* ══════════════════════ ÜBERSICHT ══════════════════════ */
db.ref(PATH).on("value", snap=>{
  allVisits = snap.val() || {};
  renderOverview();
  if(currentDetailId) renderDetail(currentDetailId);
}, err=>{
  console.error("Fehler beim Laden:", err);
  document.getElementById("visitList").innerHTML = `<div class="empty">Daten konnten nicht geladen werden:<br>${err.message}</div>`;
});

document.getElementById("filterFiliale").addEventListener("change", renderOverview);
document.getElementById("filterStatus").addEventListener("change", renderOverview);

function fmtDate(iso){
  const d = new Date(iso);
  return d.toLocaleDateString("de-DE",{day:"2-digit",month:"2-digit",year:"numeric"})+" · "+d.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});
}
function fmtDur(startISO,endISO){
  const ms = new Date(endISO||Date.now()) - new Date(startISO);
  const mins = Math.round(ms/60000);
  const h = Math.floor(mins/60), m = mins%60;
  return h>0 ? `${h} Std ${m} Min` : `${m} Min`;
}

function renderOverview(){
  const list = document.getElementById("visitList");
  const ffil = document.getElementById("filterFiliale").value;
  const fstat = document.getElementById("filterStatus").value;

  let entries = Object.entries(allVisits);
  if(ffil) entries = entries.filter(([id,v])=> v.filiale===ffil);
  if(fstat) entries = entries.filter(([id,v])=> v.status===fstat);
  entries.sort((a,b)=> new Date(b[1].start) - new Date(a[1].start));

  if(entries.length===0){
    list.innerHTML = `<div class="empty">Noch keine Filialbesuche protokolliert.<br>Starte oben einen neuen Besuch.</div>`;
    return;
  }

  list.innerHTML = entries.map(([id,v])=>`
    <div class="visitcard" data-id="${id}">
      <div class="row1">
        <div class="fil">Filiale ${v.filiale}</div>
        <div class="status ${v.status==='laeuft'?'laeuft':'fertig'}">${v.status==='laeuft'?'Läuft':'Fertig'}</div>
      </div>
      <div class="meta">${v.pruefer} — ${fmtDate(v.start)}${v.end?` · ${fmtDur(v.start,v.end)}`:''}</div>
    </div>
  `).join("");

  list.querySelectorAll(".visitcard").forEach(c=>{
    c.addEventListener("click", ()=>{ currentDetailId = c.dataset.id; renderDetail(c.dataset.id); showScreen("detail"); });
  });
}

function renderDetail(id){
  const v = allVisits[id]; if(!v) return;

  // Gesamtzahlen für Kurzübersicht ermitteln
  let nGood=0, nMid=0, nBad=0, nTotal=0, nRated=0;
  KATEGORIEN.forEach(k=>{
    const kd = (v.kategorien && v.kategorien[k.id]) || {items:{}};
    k.items.forEach((it,i)=>{
      nTotal++;
      const rating = kd.items[i] && kd.items[i].rating;
      if(!rating) return;
      nRated++;
      const cls = SCALE[it.s].find(o=>o.k===rating).cls;
      if(cls==="good") nGood++; else if(cls==="mid") nMid++; else nBad++;
    });
  });

  document.getElementById("detailHead").innerHTML = `
    <h2 style="margin-top:0;">Filiale ${v.filiale}</h2>
    <div style="color:var(--light); font-size:13px; line-height:1.7; margin-bottom:14px;">
      Prüfer: <b style="color:var(--dark);">${v.pruefer}</b><br>
      Beginn: ${fmtDate(v.start)}<br>
      ${v.end ? `Ende: ${fmtDate(v.end)}<br>Dauer: ${fmtDur(v.start,v.end)}` : `<span style="color:var(--red); font-weight:600;">Besuch läuft noch</span>`}
    </div>
    <div style="display:flex; gap:8px; flex-wrap:wrap;">
      <div class="badge good" style="font-size:12px; padding:5px 12px;">${nGood} gut</div>
      <div class="badge mid" style="font-size:12px; padding:5px 12px;">${nMid} +/-</div>
      <div class="badge bad" style="font-size:12px; padding:5px 12px;">${nBad} schlecht</div>
      <div style="font-size:12px; color:var(--light); align-self:center;">${nRated}/${nTotal} Punkte bewertet</div>
    </div>
  `;

  const body = document.getElementById("detailBody");
  body.innerHTML = KATEGORIEN.map((k,ki)=>{
    const kd = (v.kategorien && v.kategorien[k.id]) || {items:{},beurteilung:""};
    let good=0, mid=0, bad=0;
    const rows = k.items.map((it,i)=>{
      const rating = kd.items[i] && kd.items[i].rating;
      const note = kd.items[i] && kd.items[i].note;
      if(!rating && !note) return "";
      const cls = rating ? SCALE[it.s].find(o=>o.k===rating).cls : null;
      if(cls==="good") good++; else if(cls==="mid") mid++; else if(cls==="bad") bad++;
      return `<div class="item" style="padding:10px 0;">
                <div class="drow" style="border-bottom:none; padding:0;">
                  <div class="lbl">${it.t}</div>
                  ${rating?`<div class="badge ${cls}">${rating}</div>`:''}
                </div>
                ${note?`<div class="dnote">„${note}"</div>`:''}
              </div>`;
    }).join("");
    const bewertet = good+mid+bad;
    const hasIssue = mid>0 || bad>0;
    if(bewertet===0 && !kd.beurteilung) return ""; // Kategorie komplett übersprungen -> ausblenden

    return `
      <div class="catcard${hasIssue ? ' open':''}">
        <div class="cathead">
          <div class="n num">${ki+1}</div>
          <div class="t">${k.titel}</div>
          <div class="prog" style="display:flex; gap:5px; align-items:center;">
            ${bad>0?`<span style="color:var(--red); font-weight:700;">${bad} schlecht</span>`:''}
            ${mid>0?`<span style="color:var(--amber); font-weight:700;">${mid} +/-</span>`:''}
            ${bewertet}/${k.items.length}
          </div>
        </div>
        <div class="catbody" style="padding-top:6px;">
          ${rows}
          ${kd.beurteilung?`<div class="beurt"><label>Beurteilung</label><div class="beurtext">${kd.beurteilung}</div></div>`:''}
        </div>
      </div>`;
  }).join("") + (v.abschluss ? `<div class="catcard open"><div class="cathead" style="cursor:default;"><div class="t">Abschlussbemerkung</div></div><div class="catbody" style="display:block; padding-top:6px;"><div class="beurtext">${v.abschluss}</div></div></div>` : "");

  body.querySelectorAll(".catcard .cathead").forEach(h=>{
    h.addEventListener("click", ()=> h.parentElement.classList.toggle("open"));
  });
}

/* ══════════════════════ TOAST ══════════════════════ */
function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  setTimeout(()=> t.classList.remove("show"), 2200);
}

/* ══════════════════════ START ══════════════════════ */
if(activeVisitId){
  loadActiveVisit();
} else {
  showScreen("start");
}
</script>
</body>
</html>
